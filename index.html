<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LR Reader">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>LR Reader</title>
<script>
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
</head>
<body>
<main id="lib">
  <header class="bar">
    <h1>LR Reader</h1>
    <button id="open-settings" aria-label="Settings">Settings</button>
    <label class="btn">Import EPUB<input id="file" type="file" accept=".epub,application/epub+zip" hidden></label>
  </header>
  <p id="status" role="status"></p>
  <ul id="books"></ul>
</main>
<section id="reader" hidden>
  <header class="bar">
    <button id="back" aria-label="Library">&lsaquo;</button>
    <select id="toc" aria-label="Chapter"></select>
    <button id="smaller" aria-label="Smaller text">A-</button>
    <button id="bigger" aria-label="Bigger text">A+</button>
    <button id="theme" aria-label="Light or dark">&#9680;</button>
  </header>
  <div id="viewport"><article id="content"></article></div>
  <footer><span id="where"></span> <span id="sync"></span></footer>
</section>
<div id="sheet" hidden></div>
<dialog id="settings">
  <form method="dialog">
    <h2>Settings</h2>
    <label>Language Reactor email<input name="email" type="email" autocomplete="off"></label>
    <label>Token (diocoToken)<input name="token" type="password" autocomplete="off"></label>
    <div class="row">
      <label>Book language<input name="sl" size="4"></label>
      <label>My language<input name="tl" size="4"></label>
    </div>
    <p id="storage" class="sub"></p>
    <p id="sync-detail" class="sub"></p>
    <div class="row"><button value="cancel">Cancel</button><button value="save" id="save-settings">Save</button></div>
  </form>
</dialog>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
