<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LR Reader">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>LR Reader</title>
<script>
  try {
    const l = JSON.parse(localStorage.getItem("look") || "{}"), r = document.documentElement;
    if (l.theme) r.dataset.theme = l.theme;
    for (const [k, v] of Object.entries(l.vars || {})) r.style.setProperty(k, v);
  } catch {}
</script>
</head>
<body>
<main id="lib">
  <header class="bar">
    <h1>LR Reader</h1>
    <button id="open-settings" aria-label="Settings">Settings</button>
    <label class="btn">Import book<input id="file" type="file" accept=".epub,application/epub+zip,.pdf,application/pdf" hidden></label>
  </header>
  <p id="status" role="status"></p>
  <ul id="books"></ul>
</main>
<section id="reader" hidden>
  <header class="bar">
    <button id="back" aria-label="Library">&lsaquo;</button>
    <select id="toc" aria-label="Chapter"></select>
    <button id="search" aria-label="Search">&#9906;</button>
    <button id="look" aria-label="Themes and settings">Aa</button>
  </header>
  <div id="viewport"><article id="content"></article></div>
  <footer><span id="where"></span> <span id="sync"></span></footer>
</section>
<div id="sheet" hidden></div>
<div id="look-panel" class="panel" hidden></div>
<div id="search-panel" class="panel" hidden>
  <input id="search-input" type="search" placeholder="Search this book" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div id="search-results"></div>
</div>
<dialog id="prepare">
  <form method="dialog">
    <h2>Prepare for offline</h2>
    <label>From chapter<select id="prep-from"></select></label>
    <label>To chapter<select id="prep-to"></select></label>
    <p id="prep-info" class="sub"></p>
    <div class="row"><button value="cancel">Cancel</button><button value="go">Prepare</button></div>
  </form>
</dialog>
<dialog id="settings">
  <form method="dialog">
    <h2>Settings</h2>
    <label>Language Reactor email<input name="email" type="email" autocomplete="off"></label>
    <label>Token (diocoToken)<input name="token" type="password" autocomplete="off"></label>
    <div class="row">
      <label>Book language<input name="sl" size="4"></label>
      <label>My language<input name="tl" size="4"></label>
    </div>
    <label>Requests per second while preparing<input name="rate" inputmode="decimal"></label>
    <label>Voice<select name="voice"></select></label>
    <div class="row">
      <label>Speech speed<select name="speechRate"><option value="0.6">0.6x</option><option value="0.8">0.8x</option><option value="1">1x</option><option value="1.2">1.2x</option></select></label>
      <button id="test-voice" type="button">Test voice</button>
    </div>
    <label class="check"><input name="autoSay" type="checkbox"> Say the word when I tap it</label>
    <p class="sub">More Spanish voices: iOS Settings &gt; Accessibility &gt; Spoken Content &gt; Voices &gt; Spanish (Enhanced and Premium sound best).</p>
    <p id="storage" class="sub"></p>
    <p id="sync-detail" class="sub"></p>
    <div class="row"><button value="cancel">Cancel</button><button value="save" id="save-settings">Save</button></div>
  </form>
</dialog>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
